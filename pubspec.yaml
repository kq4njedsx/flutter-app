name: proj1
description: "A new Flutter project."
version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  cupertino_icons: ^1.0.8
  json_annotation: ^4.9.0
  dio: ^5.4.2+1
  pretty_dio_logger: ^1.3.1
  flutter_bloc: ^8.1.5
  equatable: ^2.0.5
  copy_with_extension_gen: ^5.0.4
  flutter_svg: ^2.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1
  flutter_lints: ^6.0.0
  json_serializable: ^6.8.0
  build_runner: ^2.4.11
  hive: ^2.2.3
  hive_flutter: ^1.1.0

flutter_icons:
  android: "ic_launcher"
  ios: false
  image_path: "assets/icon.jpg"
  min_sdk_android: 21

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/svg/